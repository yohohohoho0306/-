[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jpstock"
version = "0.1.0"
description = "日本株の株価・投資指標・企業情報をまとめて取得・表示する CLI ツール"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "rich>=13.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jpstock = "jpstock.cli:main"

[tool.setuptools]
packages = ["jpstock"]
